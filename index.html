<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gravity Cat: Fish Chase — 2D Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">

  <!-- Mobile Touch Controls -->
  <div id="touch-controls" class="hidden">
    <div class="touch-side touch-left">
      <button class="touch-btn" id="btn-left" aria-label="Move Left">◀</button>
      <button class="touch-btn" id="btn-right" aria-label="Move Right">▶</button>
    </div>
    <div class="touch-side touch-right">
      <button class="touch-btn touch-jump" id="btn-jump" aria-label="Jump">▲<br><small>JUMP</small></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/catalog.js"></script>
<script src="src/storage.js"></script>
<script src="src/textures.js"></script>
<script src="src/audio.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/HomeScene.js"></script>
<script src="src/scenes/PlayScene.js"></script>
<script src="src/scenes/GameOverScene.js"></script>
<script src="src/scenes/PauseScene.js"></script>
<script src="src/scenes/ShopScene.js"></script>
<script src="src/scenes/LeaderboardScene.js"></script>
<script src="src/scenes/SettingsScene.js"></script>
<script>
  new Phaser.Game({
    type: Phaser.AUTO,
    width: window.GCFC_CONFIG.WORLD_W,
    height: window.GCFC_CONFIG.WORLD_H,
    parent: "game-container",
    backgroundColor: "#bfe6ff",
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false },
    },
    scene: [BootScene, HomeScene, PlayScene, GameOverScene, PauseScene, ShopScene, LeaderboardScene, SettingsScene],
  });
</script>
</body>
</html>
